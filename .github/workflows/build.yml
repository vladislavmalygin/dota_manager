name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            python3-dev \
            libgl1-mesa-dev \
            libgles2-mesa-dev \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libmtdev-dev \
            xclip \
            libportmidi-dev \
            zlib1g-dev \
            libfreetype6-dev \
            libgstreamer1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            xvfb

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip wheel
          pip install -r requirements-game.txt
          pip install pyinstaller

      - name: Build Linux binary
        env:
          DISPLAY: ':99'
        run: |
          Xvfb :99 -screen 0 1280x720x24 &
          sleep 2
          pyinstaller dota_manager.spec --distpath dist/linux --workpath build/linux

      - name: Package Linux release
        run: |
          cd dist/linux
          tar -czf ../../dota_manager_linux.tar.gz dota_manager/

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: dota_manager_linux
          path: dota_manager_linux.tar.gz
          retention-days: 30

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip wheel
          pip install kivy[base]==2.3.0 kivy-deps.sdl2 kivy-deps.glew
          pip install pillow pygame pyinstaller

      - name: Build Windows binary
        run: pyinstaller dota_manager.spec --distpath dist\windows --workpath build\windows

      - name: Package Windows release
        run: |
          cd dist\windows
          Compress-Archive -Path dota_manager -DestinationPath ..\..\dota_manager_windows.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: dota_manager_windows
          path: dota_manager_windows.zip
          retention-days: 30

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dota_manager_linux/dota_manager_linux.tar.gz
            dota_manager_windows/dota_manager_windows.zip
          generate_release_notes: true
